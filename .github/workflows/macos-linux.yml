# Builds the macOS app and Linux bundle, which cannot be built on the Windows release machine.
# Every run tests, builds and self-tests the packages and keeps them as workflow artifacts.
# Run it manually with a release tag (after the release exists) to attach the archives to it.
name: macOS and Linux builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to, e.g. v0.4.2 (empty: build only)"
        required: false
  push:
    branches: [cross-platform]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macOS Apple Silicon, os: macos-14}
          - {name: macOS Intel, os: macos-15-intel}
          - {name: Linux x86_64, os: ubuntu-22.04}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux display and OpenGL libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1

      - name: Install the pinned runtime and build tools
        run: python -m pip install -r requirements-build.txt "pytest>=8,<10"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: python build_tools/build.py

      - name: Self-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          app=$(ls -d dist/Lumen-*-linux-*/ | head -1)
          xvfb-run -a "${app}Lumen" --self-test --report selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json

      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/Lumen.app
          dist/Lumen.app/Contents/MacOS/Lumen --self-test --report selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Lumen-*-macos-*.zip
            dist/Lumen-*-linux-*.tar.gz
            dist/SHA256SUMS-*-*.txt
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ inputs.tag }}" --clobber
          dist/Lumen-*-macos-*.zip dist/Lumen-*-linux-*.tar.gz dist/SHA256SUMS-*-*.txt
